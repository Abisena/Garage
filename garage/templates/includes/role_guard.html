{% set required_roles = required_roles or [] %}
{% if frappe.session.user == "Guest" %}
    <script>
        window.location.href = "/garage/login?redirect={{ frappe.request.path | urlencode }}";
    </script>
{% else %}
    <script>
        window.addEventListener('DOMContentLoaded', function () {
            var requiredRoles = {{ required_roles | tojson }};

            var requestBody = {
                cmd: 'garage.api.auth.check_portal_access',
                required_roles: requiredRoles
            };

            function disablePortalNav() {
                var navWrappers = document.querySelectorAll('.portal-nav-wrapper');
                if (!navWrappers.length) {
                    return;
                }

                var disableClick = function (event) {
                    event.preventDefault();
                    event.stopPropagation();
                };

                navWrappers.forEach(function (wrapper) {
                    wrapper.classList.add('portal-nav-disabled');

                    var navLinks = wrapper.querySelectorAll('.portal-nav__link');
                    navLinks.forEach(function (link) {
                        if (link.dataset.portalNavDisabled === 'true') {
                            return;
                        }

                        var originalHref = link.getAttribute('href');
                        if (originalHref) {
                            link.dataset.portalNavOriginalHref = originalHref;
                            link.removeAttribute('href');
                        }

                        link.classList.add('is-disabled');
                        link.setAttribute('aria-disabled', 'true');
                        link.setAttribute('tabindex', '-1');
                        link.dataset.portalNavDisabled = 'true';

                        link.addEventListener('click', disableClick, true);
                        link.addEventListener('keydown', function (event) {
                            if (event.key === 'Enter' || event.key === ' ') {
                                disableClick(event);
                            }
                        }, true);
                    });
                });
            }

            function handleDeniedAccess() {
                disablePortalNav();
            }

            fetch('/api/method/garage.api.auth.check_portal_access', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify(requestBody)
            })
                .then(function (response) { return response.json(); })
                .then(function (data) {
                    var hasAccess = data && data.message && data.message.has_access;
                    if (!hasAccess) {
                        handleDeniedAccess();
                    }
                })
                .catch(function () {
                    handleDeniedAccess();
                });
        });
    </script>
{% endif %}
