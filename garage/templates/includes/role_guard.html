{% set required_roles = required_roles or [] %}
{% if frappe.session.user == "Guest" %}
    <script>
        window.location.href = "/garage/login?redirect={{ frappe.request.path | urlencode }}";
    </script>
{% else %}
    <script>
        window.addEventListener('DOMContentLoaded', function () {
            var requiredRoles = {{ required_roles | tojson }};

            var requestBody = {
                cmd: 'garage.api.auth.check_portal_access',
                required_roles: requiredRoles
            };

            function redirectToPortalHome() {
                alert('Anda tidak memiliki akses');
                fetch('/api/method/garage.api.auth.get_portal_home')
                    .then(function (response) { return response.json(); })
                    .then(function (data) {
                        var message = data && data.message ? data.message : null;
                        var route = (message && (message.route || message)) || '/garage/login';
                        window.location.href = route || '/garage/login';
                    })
                    .catch(function () {
                        window.location.href = '/garage/login';
                    });
            }

            fetch('/api/method/garage.api.auth.check_portal_access', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify(requestBody)
            })
                .then(function (response) { return response.json(); })
                .then(function (data) {
                    var hasAccess = data && data.message && data.message.has_access;
                    if (!hasAccess) {
                        redirectToPortalHome();
                    }
                })
                .catch(function () {
                    redirectToPortalHome();
                });
        });
    </script>
{% endif %}
